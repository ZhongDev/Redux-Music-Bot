name: Build & publish Docker image

# Builds a multi-arch (x64 + arm64) image and pushes it to GitHub Container Registry so a
# homelab host (Dockge, Portainer, plain compose) can simply `docker compose pull`.
#
# Tags produced (see docker/metadata-action):
#   ghcr.io/zhongdev/redux-music-bot:latest        default branch (main)
#   ghcr.io/zhongdev/redux-music-bot:<branch>      e.g. rewrite-v2
#   ghcr.io/zhongdev/redux-music-bot:<version>     from git tags like v2.0.0 (also 2.0, 2)
#   ghcr.io/zhongdev/redux-music-bot:sha-<short>   every build

on:
  push:
    branches: [main, rewrite/v2]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Hardcoded lowercase: GHCR rejects uppercase paths and github.repository_owner is "ZhongDev".
  IMAGE_NAME: ghcr.io/zhongdev/redux-music-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase repository path.
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
